name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Validate edge bridge dependency notices
        run: |
          cargo install --locked --version 0.9.2 --features cli cargo-about
          cargo install --locked --version 0.22.2 cargo-audit
          python3 tools/generate_edge_bridge_notices.py --check
          cargo audit --file edge-bridge/Cargo.lock

      - name: Validate release target
        id: release
        shell: bash
        run: |
          git fetch --no-tags origin main
          uv run --frozen python tools/check_release.py \
            --tag "$GITHUB_REF_NAME" \
            --revision "$GITHUB_SHA"
          version="${GITHUB_REF_NAME#v}"
          visualizer_image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          edge_bridge_image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scrap-monitoring-visualizer-edge-bridge"
          {
            echo "version=$version"
            echo "visualizer_image_name=$visualizer_image_name"
            echo "visualizer_revision_ref=$visualizer_image_name:sha-$GITHUB_SHA"
            echo "visualizer_version_ref=$visualizer_image_name:$version"
            echo "edge_bridge_image_name=$edge_bridge_image_name"
            echo "edge_bridge_revision_ref=$edge_bridge_image_name:sha-$GITHUB_SHA"
            echo "edge_bridge_version_ref=$edge_bridge_image_name:$version"
          } >> "$GITHUB_OUTPUT"

      - name: Validate source
        run: |
          uv run --frozen rumdl check --no-config --no-cache --disable MD013 .
          uv run --frozen python tools/check_repository.py
          uv run --frozen ruff format --check src tests tools
          uv run --frozen ruff check src tests tools
          uv run --frozen mypy
          uv run --frozen python -m pytest
          uv run --frozen python -m compileall -q src tests tools
          scripts/check-deployment.sh
          docker build \
            --file Dockerfile.edge-bridge \
            --target test \
            --tag scrap-monitoring-visualizer-edge-bridge:test \
            .

      - name: Build Python package
        run: uv build --no-sources

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          version: v0.37.1
          driver-opts: |
            image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing image tags
        id: existing
        env:
          EDGE_BRIDGE_REVISION_REF: ${{ steps.release.outputs.edge_bridge_revision_ref }}
          EDGE_BRIDGE_VERSION_REF: ${{ steps.release.outputs.edge_bridge_version_ref }}
          VISUALIZER_REVISION_REF: ${{ steps.release.outputs.visualizer_revision_ref }}
          VISUALIZER_VERSION_REF: ${{ steps.release.outputs.visualizer_version_ref }}
        shell: bash
        run: |
          inspect_digest() {
            local image_ref="$1"
            local error_path="$RUNNER_TEMP/image-inspect-error"
            local digest
            if digest="$(
              docker buildx imagetools inspect "$image_ref" \
                --format '{{.Manifest.Digest}}' 2> "$error_path"
            )"; then
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "invalid manifest digest for $image_ref: $digest" >&2
                return 1
              fi
              printf '%s' "$digest"
              return 0
            fi
            if grep --quiet --ignore-case --extended-regexp \
              'manifest unknown|name unknown|not found' "$error_path"; then
              return 0
            fi
            cat "$error_path" >&2
            return 1
          }
          check_tag_pair() {
            local output_prefix="$1"
            local version_ref="$2"
            local revision_ref="$3"
            local version_digest
            local revision_digest
            version_digest="$(inspect_digest "$version_ref")"
            revision_digest="$(inspect_digest "$revision_ref")"
            if [[ -z "$version_digest" && -z "$revision_digest" ]]; then
              echo "${output_prefix}_publish=true" >> "$GITHUB_OUTPUT"
            elif [[ "$version_digest" =~ ^sha256:[0-9a-f]{64}$ && \
                    "$version_digest" == "$revision_digest" ]]; then
              {
                echo "${output_prefix}_digest=$version_digest"
                echo "${output_prefix}_publish=false"
              } >> "$GITHUB_OUTPUT"
            elif [[ "$version_digest" =~ ^sha256:[0-9a-f]{64}$ && \
                    -z "$revision_digest" ]]; then
              {
                echo "${output_prefix}_digest=$version_digest"
                echo "${output_prefix}_missing_ref=$revision_ref"
                echo "${output_prefix}_publish=false"
              } >> "$GITHUB_OUTPUT"
            elif [[ -z "$version_digest" && \
                    "$revision_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              {
                echo "${output_prefix}_digest=$revision_digest"
                echo "${output_prefix}_missing_ref=$version_ref"
                echo "${output_prefix}_publish=false"
              } >> "$GITHUB_OUTPUT"
            else
              echo "$output_prefix release image tags are incomplete or inconsistent" >&2
              exit 1
            fi
          }
          check_tag_pair \
            visualizer \
            "$VISUALIZER_VERSION_REF" \
            "$VISUALIZER_REVISION_REF"
          check_tag_pair \
            edge_bridge \
            "$EDGE_BRIDGE_VERSION_REF" \
            "$EDGE_BRIDGE_REVISION_REF"

      - name: Build and publish visualizer OCI image
        if: steps.existing.outputs.visualizer_publish == 'true'
        id: publish_visualizer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.visualizer_version_ref }}
            ${{ steps.release.outputs.visualizer_revision_ref }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-visualizer-amd64
          cache-to: type=gha,mode=max,scope=release-visualizer-amd64

      - name: Build and publish edge bridge OCI image
        if: steps.existing.outputs.edge_bridge_publish == 'true'
        id: publish_edge_bridge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.edge-bridge
          platforms: linux/arm64
          target: runtime
          push: true
          tags: |
            ${{ steps.release.outputs.edge_bridge_version_ref }}
            ${{ steps.release.outputs.edge_bridge_revision_ref }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-edge-bridge-arm64
          cache-to: type=gha,mode=max,scope=release-edge-bridge-arm64

      - name: Resolve and verify OCI images
        id: images
        env:
          EDGE_BRIDGE_EXISTING_DIGEST: ${{ steps.existing.outputs.edge_bridge_digest }}
          EDGE_BRIDGE_IMAGE_NAME: ${{ steps.release.outputs.edge_bridge_image_name }}
          EDGE_BRIDGE_MISSING_REF: ${{ steps.existing.outputs.edge_bridge_missing_ref }}
          EDGE_BRIDGE_PUBLISHED_DIGEST: ${{ steps.publish_edge_bridge.outputs.digest }}
          EDGE_BRIDGE_REVISION_REF: ${{ steps.release.outputs.edge_bridge_revision_ref }}
          EDGE_BRIDGE_VERSION_REF: ${{ steps.release.outputs.edge_bridge_version_ref }}
          VERSION: ${{ steps.release.outputs.version }}
          VISUALIZER_EXISTING_DIGEST: ${{ steps.existing.outputs.visualizer_digest }}
          VISUALIZER_IMAGE_NAME: ${{ steps.release.outputs.visualizer_image_name }}
          VISUALIZER_MISSING_REF: ${{ steps.existing.outputs.visualizer_missing_ref }}
          VISUALIZER_PUBLISHED_DIGEST: ${{ steps.publish_visualizer.outputs.digest }}
          VISUALIZER_REVISION_REF: ${{ steps.release.outputs.visualizer_revision_ref }}
          VISUALIZER_VERSION_REF: ${{ steps.release.outputs.visualizer_version_ref }}
        shell: bash
        run: |
          verify_image() {
            local output_prefix="$1"
            local image_name="$2"
            local version_ref="$3"
            local revision_ref="$4"
            local published_digest="$5"
            local existing_digest="$6"
            local expected_architecture="$7"
            local missing_ref="$8"
            local digest
            local version_digest
            local revision_digest
            local metadata_prefix
            digest="${published_digest:-$existing_digest}"
            if [[ "$missing_ref" == "$version_ref" ]]; then
              version_digest=""
            else
              version_digest="$(
                docker buildx imagetools inspect "$version_ref" \
                  --format '{{.Manifest.Digest}}'
              )"
            fi
            if [[ "$missing_ref" == "$revision_ref" ]]; then
              revision_digest=""
            else
              revision_digest="$(
                docker buildx imagetools inspect "$revision_ref" \
                  --format '{{.Manifest.Digest}}'
              )"
            fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ || \
                  ( -z "$version_digest" && -z "$revision_digest" ) ]]; then
              echo "$output_prefix available tags do not resolve to one valid digest" >&2
              exit 1
            fi
            if [[ -n "$version_digest" && "$digest" != "$version_digest" ]]; then
              echo "$output_prefix version tag has an unexpected digest" >&2
              exit 1
            fi
            if [[ -n "$revision_digest" && "$digest" != "$revision_digest" ]]; then
              echo "$output_prefix revision tag has an unexpected digest" >&2
              exit 1
            fi

            metadata_prefix="$RUNNER_TEMP/$output_prefix"
            docker buildx imagetools inspect --raw "$image_name@$digest" \
              > "$metadata_prefix-manifest.json"
            mapfile -t manifest_digests < <(
              python - \
                "$metadata_prefix-manifest.json" \
                "$expected_architecture" <<'PY'
          import json
          import re
          import sys


          with open(sys.argv[1], encoding="utf-8") as source:
              manifest = json.load(source)
          if manifest.get("mediaType") != "application/vnd.oci.image.index.v1+json":
              raise SystemExit("release image must be an OCI image index")

          entries = manifest.get("manifests", ())
          runnable = [
              entry
              for entry in entries
              if entry.get("platform", {}).get("os") != "unknown"
          ]
          platforms = [
              (
                  entry.get("platform", {}).get("os"),
                  entry.get("platform", {}).get("architecture"),
              )
              for entry in runnable
          ]
          expected = [("linux", sys.argv[2])]
          if platforms != expected:
              raise SystemExit(
                  f"release manifest must contain one {expected[0]} runnable image: "
                  f"observed {platforms}"
              )

          runnable_digest = runnable[0].get("digest")
          if not isinstance(runnable_digest, str) or re.fullmatch(
              r"sha256:[0-9a-f]{64}", runnable_digest
          ) is None:
              raise SystemExit("release runnable image has an invalid digest")
          attestations = [
              entry
              for entry in entries
              if entry.get("platform") == {"architecture": "unknown", "os": "unknown"}
              and entry.get("annotations", {}).get("vnd.docker.reference.type")
              == "attestation-manifest"
              and entry.get("annotations", {}).get("vnd.docker.reference.digest")
              == runnable_digest
          ]
          if len(attestations) != 1 or len(entries) != 2:
              raise SystemExit(
                  "release index must contain one runnable image and its attestation manifest"
              )
          attestation_digest = attestations[0].get("digest")
          if not isinstance(attestation_digest, str) or re.fullmatch(
              r"sha256:[0-9a-f]{64}", attestation_digest
          ) is None:
              raise SystemExit("release attestation has an invalid digest")
          print(runnable_digest)
          print(attestation_digest)
          PY
            )
            if [[ "${#manifest_digests[@]}" -ne 2 ]]; then
              echo "$output_prefix manifest validation did not return both digests" >&2
              exit 1
            fi

            runnable_digest="${manifest_digests[0]}"
            attestation_digest="${manifest_digests[1]}"
            docker buildx imagetools inspect --raw \
              "$image_name@$attestation_digest" \
              > "$metadata_prefix-attestation.json"
            python - \
              "$metadata_prefix-attestation.json" \
              "$runnable_digest" <<'PY'
          import json
          import sys


          with open(sys.argv[1], encoding="utf-8") as source:
              manifest = json.load(source)
          if (
              manifest.get("artifactType")
              != "application/vnd.docker.attestation.manifest.v1+json"
          ):
              raise SystemExit("release attestation has an unexpected artifact type")
          if manifest.get("subject", {}).get("digest") != sys.argv[2]:
              raise SystemExit("release attestation subject differs from the runnable image")

          layers = manifest.get("layers", ())
          if any(
              layer.get("mediaType") != "application/vnd.in-toto+json"
              for layer in layers
          ):
              raise SystemExit("release attestation layers must use the in-toto media type")
          predicates = {
              layer.get("annotations", {}).get("in-toto.io/predicate-type")
              for layer in layers
          }
          if None in predicates:
              raise SystemExit("release attestation layer is missing its predicate type")
          required = {
              "https://spdx.dev/Document",
              "https://slsa.dev/provenance/v1",
          }
          if not required.issubset(predicates):
              raise SystemExit(
                  f"release attestation predicates are incomplete: {sorted(predicates)}"
              )
          PY

            docker pull --platform "linux/$expected_architecture" "$image_name@$digest"
            image_version="$(
              docker image inspect "$image_name@$digest" \
                --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
            )"
            image_revision="$(
              docker image inspect "$image_name@$digest" \
                --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
            )"
            image_platform="$(
              docker image inspect "$image_name@$digest" \
                --format '{{.Os}}/{{.Architecture}}'
            )"
            if [[ "$image_version" != "$VERSION" || \
                  "$image_revision" != "$GITHUB_SHA" || \
                  "$image_platform" != "linux/$expected_architecture" ]]; then
              echo "$output_prefix image configuration does not match the release target" >&2
              exit 1
            fi
            if [[ -n "$missing_ref" ]]; then
              docker buildx imagetools create \
                --tag "$missing_ref" \
                "$image_name@$digest"
            fi
            version_digest="$(
              docker buildx imagetools inspect "$version_ref" \
                --format '{{.Manifest.Digest}}'
            )"
            revision_digest="$(
              docker buildx imagetools inspect "$revision_ref" \
                --format '{{.Manifest.Digest}}'
            )"
            if [[ "$digest" != "$version_digest" ]]; then
              echo "$output_prefix version tag recovery changed the digest" >&2
              exit 1
            fi
            if [[ "$digest" != "$revision_digest" ]]; then
              echo "$output_prefix image tag recovery did not preserve the digest" >&2
              exit 1
            fi
            echo "${output_prefix}_digest=$digest" >> "$GITHUB_OUTPUT"
          }
          verify_image \
            visualizer \
            "$VISUALIZER_IMAGE_NAME" \
            "$VISUALIZER_VERSION_REF" \
            "$VISUALIZER_REVISION_REF" \
            "$VISUALIZER_PUBLISHED_DIGEST" \
            "$VISUALIZER_EXISTING_DIGEST" \
            amd64 \
            "$VISUALIZER_MISSING_REF"
          verify_image \
            edge_bridge \
            "$EDGE_BRIDGE_IMAGE_NAME" \
            "$EDGE_BRIDGE_VERSION_REF" \
            "$EDGE_BRIDGE_REVISION_REF" \
            "$EDGE_BRIDGE_PUBLISHED_DIGEST" \
            "$EDGE_BRIDGE_EXISTING_DIGEST" \
            arm64 \
            "$EDGE_BRIDGE_MISSING_REF"

      - name: Validate published visualizer image
        env:
          IMAGE_UNDER_TEST: ${{ steps.release.outputs.visualizer_image_name }}@${{ steps.images.outputs.visualizer_digest }}
          SKIP_IMAGE_BUILD: "true"
        run: scripts/check-headless-container.sh

      - name: Verify public package visibility
        env:
          EDGE_BRIDGE_IMAGE_NAME: ${{ steps.release.outputs.edge_bridge_image_name }}
          GH_TOKEN: ${{ github.token }}
          VISUALIZER_IMAGE_NAME: ${{ steps.release.outputs.visualizer_image_name }}
        shell: bash
        run: |
          verify_visibility() {
            local image_name="$1"
            local package_name
            local visibility=""
            package_name="${image_name##*/}"
            for _ in 1 2 3 4 5; do
              visibility="$(
                gh api "/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name" \
                  --jq .visibility 2>/dev/null || true
              )"
              if [[ "$visibility" == "public" ]]; then
                return 0
              fi
              sleep 5
            done
            echo "GHCR package visibility is not public for $package_name: ${visibility:-unavailable}" >&2
            return 1
          }
          verify_visibility "$VISUALIZER_IMAGE_NAME"
          verify_visibility "$EDGE_BRIDGE_IMAGE_NAME"

      - name: Assemble release assets
        env:
          EDGE_BRIDGE_IMAGE_DIGEST: ${{ steps.images.outputs.edge_bridge_digest }}
          EDGE_BRIDGE_IMAGE_NAME: ${{ steps.release.outputs.edge_bridge_image_name }}
          EDGE_BRIDGE_REVISION_REF: ${{ steps.release.outputs.edge_bridge_revision_ref }}
          EDGE_BRIDGE_VERSION_REF: ${{ steps.release.outputs.edge_bridge_version_ref }}
          VERSION: ${{ steps.release.outputs.version }}
          VISUALIZER_IMAGE_DIGEST: ${{ steps.images.outputs.visualizer_digest }}
          VISUALIZER_IMAGE_NAME: ${{ steps.release.outputs.visualizer_image_name }}
          VISUALIZER_REVISION_REF: ${{ steps.release.outputs.visualizer_revision_ref }}
          VISUALIZER_VERSION_REF: ${{ steps.release.outputs.visualizer_version_ref }}
        shell: bash
        run: |
          mkdir release
          cp dist/*.whl dist/*.tar.gz release/
          cp THIRD_PARTY_NOTICES.md release/
          git archive \
            --format=tar \
            --prefix=scrap-monitoring-visualizer-deployment/ \
            "$GITHUB_SHA" \
            .env.example \
            deploy \
            | gzip -n > release/deployment.tar.gz
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint python \
            "$VISUALIZER_IMAGE_NAME@$VISUALIZER_IMAGE_DIGEST" \
            -m scrap_monitoring_visualizer.dependency_audit \
            > release/dependency-inventory.json
          printf '%s@%s\n' "$VISUALIZER_IMAGE_NAME" "$VISUALIZER_IMAGE_DIGEST" \
            > release/oci-image.txt
          printf '%s@%s\n' "$EDGE_BRIDGE_IMAGE_NAME" "$EDGE_BRIDGE_IMAGE_DIGEST" \
            > release/edge-bridge-oci-image.txt
          jq -n \
            --arg edge_bridge_digest "$EDGE_BRIDGE_IMAGE_DIGEST" \
            --arg edge_bridge_image "$EDGE_BRIDGE_IMAGE_NAME" \
            --arg edge_bridge_revision_ref "$EDGE_BRIDGE_REVISION_REF" \
            --arg edge_bridge_version_ref "$EDGE_BRIDGE_VERSION_REF" \
            --arg source_commit "$GITHUB_SHA" \
            --arg version "$VERSION" \
            --arg visualizer_digest "$VISUALIZER_IMAGE_DIGEST" \
            --arg visualizer_image "$VISUALIZER_IMAGE_NAME" \
            --arg visualizer_revision_ref "$VISUALIZER_REVISION_REF" \
            --arg visualizer_version_ref "$VISUALIZER_VERSION_REF" \
            '{
              source_commit: $source_commit,
              version: $version,
              images: {
                visualizer: {
                  digest: $visualizer_digest,
                  image: $visualizer_image,
                  platform: "linux/amd64",
                  revision_ref: $visualizer_revision_ref,
                  version_ref: $visualizer_version_ref
                },
                edge_bridge: {
                  digest: $edge_bridge_digest,
                  image: $edge_bridge_image,
                  platform: "linux/arm64",
                  revision_ref: $edge_bridge_revision_ref,
                  version_ref: $edge_bridge_version_ref
                }
              }
            }' > release/release-metadata.json
          (
            cd release
            sha256sum \
              THIRD_PARTY_NOTICES.md \
              deployment.tar.gz \
              dependency-inventory.json \
              edge-bridge-oci-image.txt \
              oci-image.txt \
              release-metadata.json \
              scrap_monitoring_visualizer-*.tar.gz \
              scrap_monitoring_visualizer-*.whl \
              > SHA256SUMS
          )
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Scrap Monitoring Visualizer $VERSION

          Visualizer image: $VISUALIZER_IMAGE_NAME
          Visualizer manifest digest: $VISUALIZER_IMAGE_DIGEST
          Visualizer deployment reference: $VISUALIZER_IMAGE_NAME@$VISUALIZER_IMAGE_DIGEST

          Edge bridge image: $EDGE_BRIDGE_IMAGE_NAME
          Edge bridge manifest digest: $EDGE_BRIDGE_IMAGE_DIGEST
          Edge bridge deployment reference: $EDGE_BRIDGE_IMAGE_NAME@$EDGE_BRIDGE_IMAGE_DIGEST

          Source commit: $GITHUB_SHA
          EOF

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state="$(
            gh release view "$GITHUB_REF_NAME" \
              --json isDraft \
              --jq 'if .isDraft then "draft" else "published" end' \
              2>/dev/null || true
          )"
          if [[ "$state" == "published" ]]; then
            exit 0
          fi
          if [[ "$state" == "draft" ]]; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
